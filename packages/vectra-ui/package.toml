schema = "ailang.package-source.v1"
name = "vectra-ui"
version = "0.0.1-alpha.1"
types = ["library"]

[dependencies]
aivectra = "0.0.1-alpha.30"

[libraries.elements]
namespace = "vectra.ui.elements"
entry = "src/vectra/ui/elements.aos"
exports = [
  "button",
  "buttonHit",
  "field",
  "entry",
  "entryHit",
  "radioButton",
  "radioHit",
]

[libraries.button]
namespace = "vectra.ui.button"
