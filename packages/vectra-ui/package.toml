exports = [
  "button",
  "buttonHit",
]

[libraries.field]
namespace = "vectra.ui.field"
entry = "src/vectra/ui/field.aos"
exports = [
  "field",
  "entry",
  "entryHit",
]

[libraries.radio]
namespace = "vectra.ui.radio"
entry = "src/vectra/ui/radio.aos"
exports = [
  "radioButton",
  "radioHit",
]
