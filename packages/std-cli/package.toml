schema = "ailang.package-source.v1"
name = "std-cli"
version = "0.0.1-alpha.2"
types = ["library"]
description = "Deterministic explicit-registration CLI framework for AiLang applications"

[libraries.cli]
namespace = "std.cli"
entry = "src/cli/cli.aos"
exports = [
  "createApplication",
  "createCommand",
  "createArgument",
  "createOption",
  "commandWithUsage",
  "commandWithArgument",
  "commandWithOption",
  "commandAllowTrailing",
  "commandAsExecutable",
  "registerCommand",
  "execute",
  "run",
  "cliResult",
  "invocationPositional",
  "invocationOption",
  "invocationHasFlag",
  "invocationRemaining",
  "invocationRawArgs",
  "formatRootHelp",
  "formatCommandHelp",
  "formatVersion",
  "diagnosticCode",
  "diagnosticMessage",
]
