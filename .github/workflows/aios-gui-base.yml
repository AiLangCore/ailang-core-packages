name: AiOS GUI Base Images

on:
  workflow_dispatch:

jobs:
  build-base:
    name: Build ${{ matrix.arch }} base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Buildroot host dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential cpio file flex git gzip libelf-dev libncurses-dev rsync unzip wget

      - name: Fetch Buildroot
        run: packages/target-aios-gui/tools/aios fetch-buildroot --buildroot-version 2026.02.3 --arch "${{ matrix.arch }}"

      - name: Build AiOS GUI base
        run: packages/target-aios-gui/tools/aios build-base --target aios-gui --version 0.0.1-alpha.1 --buildroot-version 2026.02.3 --arch "${{ matrix.arch }}"

      - name: Stage base artifact
        run: |
          BASE_DIR="$HOME/.ailang/cache/aios/base/aios-gui/0.0.1-alpha.1/${{ matrix.arch }}"
          OUT_DIR="aios-gui-0.0.1-alpha.1-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"
          cp "$BASE_DIR/manifest.toml" "$OUT_DIR/manifest.toml"
          cp "$BASE_DIR/bzImage" "$OUT_DIR/bzImage"
          cp "$BASE_DIR/rootfs.cpio.gz" "$OUT_DIR/rootfs.cpio.gz"

      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: aios-gui-0.0.1-alpha.1-${{ matrix.arch }}
          path: aios-gui-0.0.1-alpha.1-${{ matrix.arch }}
          if-no-files-found: error
