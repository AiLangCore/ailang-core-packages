name: AiOS Base

on:
  workflow_dispatch:
    inputs:
      aios_version:
        description: AiOS base version
        required: true
        default: 0.0.1-alpha.1
      buildroot_version:
        description: Buildroot tag
        required: true
        default: 2026.02.3
  push:
    tags:
      - 'aios-base-*'

jobs:
  build-aios-gui-base:
    name: Build AiOS GUI Base (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
    env:
      AIOS_CACHE_ROOT: ${{ github.workspace }}/.aios-cache
      AIOS_VERSION: ${{ inputs.aios_version || '0.0.1-alpha.1' }}
      AIOS_BUILDROOT_VERSION: ${{ inputs.buildroot_version || '2026.02.3' }}
      AIOS_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            file \
            flex \
            git \
            gzip \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            perl \
            python3 \
            rsync \
            unzip \
            wget

      - name: Fetch Buildroot
        run: packages/target-aios-gui/tools/aios fetch-buildroot --buildroot-version "$AIOS_BUILDROOT_VERSION" --arch "$AIOS_ARCH"

      - name: Build cached AiOS base
        run: |
          packages/target-aios-gui/tools/aios build-base \
            --target aios-gui \
            --version "$AIOS_VERSION" \
            --arch "$AIOS_ARCH" \
            --buildroot-version "$AIOS_BUILDROOT_VERSION"

      - name: Verify cached AiOS base
        run: |
          packages/target-aios-gui/tools/aios verify-base \
            --target aios-gui \
            --version "$AIOS_VERSION" \
            --arch "$AIOS_ARCH" \
            --buildroot-version "$AIOS_BUILDROOT_VERSION"

      - name: Stage AiOS base artifact
        run: |
          BASE_DIR="$AIOS_CACHE_ROOT/base/aios-gui/$AIOS_VERSION/$AIOS_ARCH"
          OUT_DIR="aios-gui-$AIOS_VERSION-$AIOS_ARCH"
          mkdir -p "$OUT_DIR"
          cp "$BASE_DIR/manifest.toml" "$OUT_DIR/manifest.toml"
          cp "$BASE_DIR/bzImage" "$OUT_DIR/bzImage"
          cp "$BASE_DIR/rootfs.cpio.gz" "$OUT_DIR/rootfs.cpio.gz"

      - name: Upload AiOS base artifact
        uses: actions/upload-artifact@v4
        with:
          name: aios-gui-${{ env.AIOS_VERSION }}-${{ env.AIOS_ARCH }}
          path: aios-gui-${{ env.AIOS_VERSION }}-${{ env.AIOS_ARCH }}
          if-no-files-found: error
